<title>Tablewise POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: persistent left rail + working area. The rail turns into a scrolling pill row on phones.
   Colour: cool slate neutrals, deep teal accent, and the Indian green/red veg markers as the only other hues. */
:root{
  --bg:#F2F5F8;--surface:#FFFFFF;--surface-2:#E8EDF3;--line:#D6DDE6;--fg:#141A24;--muted:#566275;
  --accent:#0B6E6D;--accent-fg:#FFFFFF;--accent-soft:#D6EEED;
  --good:#17803F;--good-soft:#DAF1E2;--warn:#A8600A;--warn-soft:#FAEACD;--bad:#BE3328;--bad-soft:#F8DDD9;--info:#2A57C9;--info-soft:#DCE5F9;
  --font-display:'Sora',system-ui,sans-serif;--font-body:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A;--surface:#161D27;--surface-2:#1E2733;--line:#2A3544;--fg:#E6EBF2;--muted:#95A2B5;
    --accent:#46BDBA;--accent-fg:#04201F;--accent-soft:#143538;
    --good:#4DC180;--good-soft:#173525;--warn:#E5A44C;--warn-soft:#3A2C15;--bad:#F2796D;--bad-soft:#3F1E1B;--info:#7F9FF2;--info-soft:#1C2A4E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A;--surface:#161D27;--surface-2:#1E2733;--line:#2A3544;--fg:#E6EBF2;--muted:#95A2B5;
  --accent:#46BDBA;--accent-fg:#04201F;--accent-soft:#143538;
  --good:#4DC180;--good-soft:#173525;--warn:#E5A44C;--warn-soft:#3A2C15;--bad:#F2796D;--bad-soft:#3F1E1B;--info:#7F9FF2;--info-soft:#1C2A4E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:24px;letter-spacing:-.01em}
h2{font-size:16px}
p{margin:0}
.sub{color:var(--muted);font-size:13px}
.lb{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.mono{font-family:var(--font-mono)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* Controls */
.btn{font:inherit;font-weight:500;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;min-height:30px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;width:100%;min-width:0}
input[type=radio],input[type=checkbox]{width:auto;min-height:0}
.fld{display:grid;gap:5px;min-width:0}
.fld>label,.fld>.lb{font-size:12px;font-weight:600;color:var(--muted)}
.fld.full{grid-column:1/-1}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fg{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{font:inherit;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.14)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sw{width:38px;height:22px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(16px)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.vm{width:14px;height:14px;border:1.5px solid var(--good);border-radius:3px;display:inline-grid;place-items:center;flex:none;vertical-align:-2px}
.vm::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.vm.nv{border-color:var(--bad)}
.vm.nv::after{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card>h2{margin-bottom:12px}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.empty.small{padding:12px;font-size:13px}

/* Shell */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:24px;padding-block:16px;max-width:1440px;margin:0 auto;align-items:start}
.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.15}
.brand .rn{font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted)}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.nav svg{flex:none}
.nav .badge{margin-left:auto}
.rail-foot{display:grid;gap:10px}
.rail-foot .note{font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px}
  .rail{position:static;gap:12px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav a{white-space:nowrap;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
  .nav .badge{margin-left:2px}
  .rail-foot .note{display:none}
}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.ph .sub{margin-top:2px}
.stack{display:grid;gap:16px}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{display:grid;gap:6px;align-content:start}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
@media (max-width:1000px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font:11px var(--font-body)}
.chart .tx.hl{fill:var(--fg);font-weight:600}
.chart .bar{fill:var(--accent);opacity:.38}
.chart .bar.hi{opacity:1}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0;padding-bottom:0}
.li:first-child{padding-top:0}
.li>:first-child{min-width:0}
.li .nm{font-weight:500}
.sb{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.sb i{display:block;height:100%;background:var(--accent)}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
@media (max-width:1100px){.pos{grid-template-columns:minmax(0,1fr)}}
.cart{position:sticky;top:16px;display:grid;gap:14px}
@media (max-width:1100px){.cart{position:static}}
.tbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:8px}
.tb{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 4px;cursor:pointer;display:grid;justify-items:center;min-height:42px;align-content:center}
.tb small{font-size:10px;font-weight:500;color:var(--warn)}
.tb.busy{background:var(--warn-soft);border-color:transparent}
.tb[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tb[aria-pressed=true] small{color:inherit}
.search{position:relative;flex:1;min-width:170px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.item{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:96px;font:inherit;color:inherit}
.item:hover{border-color:var(--accent)}
.item[disabled]{opacity:.55;cursor:not-allowed}
.item[disabled]:hover{border-color:var(--line)}
.item .nm{font-weight:600;line-height:1.3}
.item .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.item .pr{font-family:var(--font-mono);font-weight:500}
.qb{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-fg);border-radius:999px;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:12px;font-weight:600}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cl .nm{font-weight:500}
.lt{text-align:right;font-variant-numeric:tabular-nums}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.step button{width:30px;height:30px;border:0;background:transparent;color:var(--fg);cursor:pointer;font-size:16px}
.step span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.tot{display:grid;gap:4px}
.tr{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tr.m{color:var(--muted)}
.tr.grand{font-family:var(--font-display);font-size:20px;font-weight:600;padding-top:8px;margin-top:4px;border-top:1px dashed var(--line)}
.fab{display:none}
@media (max-width:1100px){
  .fab{display:inline-flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 6px 20px rgb(0 0 0/.3)}
}

/* Orders board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1180px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:10px;border-top:3px solid var(--st)}
.col[data-s=new]{--st:var(--info)}
.col[data-s=preparing]{--st:var(--warn)}
.col[data-s=ready]{--st:var(--good)}
.col[data-s=done]{--st:var(--muted)}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;font-family:var(--font-body);font-weight:600}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;min-width:0}
.oc .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.oc .no{font-family:var(--font-mono);font-weight:500;font-size:15px}
.oc ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.oc li{display:flex;gap:6px}
.oc li b{font-family:var(--font-mono);font-weight:500;min-width:24px}
.oc .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.oc .acts{display:flex;gap:6px;flex-wrap:wrap}
.late{color:var(--bad);font-weight:600}
.cx{text-decoration:line-through;color:var(--muted)}

/* Tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td .nm{font-weight:500}
.lvl{width:90px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.lvl i{display:block;height:100%;background:var(--good)}
.lvl.low i{background:var(--warn)}
.lvl.out i{background:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

/* Modal + toasts */
.ov{position:fixed;inset:0;background:rgb(10 15 22/.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.md{background:var(--surface);color:var(--fg);border-radius:14px;border:1px solid var(--line);width:min(560px,100%);margin:auto;box-shadow:0 20px 60px rgb(0 0 0/.35)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mb{padding:18px;display:grid;gap:14px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.rr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.kot{font-family:var(--font-mono);border:1px dashed var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.kot .big{font-size:28px;font-weight:500}
.kot li{display:flex;gap:10px;font-size:15px}
.kot ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.toasts{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:60}
@media (max-width:1100px){.toasts{bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 52px)}}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0/.3);pointer-events:auto;max-width:min(460px,100%)}
/* Online orders */
.plats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:16px}
.plat{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.plat .nm{font-weight:600}
.incs{display:grid;gap:12px}
.inc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.inc.urgent{border-color:var(--bad)}
.incg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.incg{grid-template-columns:minmax(0,1fr)}}
.ilist{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.ilist li{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center}
.ilist .q{font-family:var(--font-mono);font-weight:500}
.onote{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px}
.oc .onote{padding:6px 8px;font-size:12px}
/* Reports */
.rp{display:grid;gap:14px}
.rp .row select{width:auto;min-width:220px;max-width:100%}
.rp input[type=date]{width:auto;max-width:100%}
.rsum{font-size:15px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px}
.up{color:var(--good)}.down{color:var(--bad)}
details.card>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"Show";color:var(--accent);font-weight:500;font-size:13px}
details.card[open]>summary::after{content:"Hide"}
/* Device pairing */
.paircode{font-family:var(--font-mono);font-size:clamp(40px,9vw,64px);font-weight:500;letter-spacing:.12em;padding:8px 0}
.howto{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;color:var(--muted);font-size:13px}
/* Order search */
.find{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.find .search{flex:1 1 320px;max-width:560px}
.find .search input{min-height:44px;font-size:16px}
.find kbd{font:12px var(--font-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface)}
.res{display:grid;gap:10px;margin-bottom:16px}
.rr2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rr2:last-child{border-bottom:0;padding-bottom:0}
.rr2:first-of-type{padding-top:0}
.rr2 .big{font-family:var(--font-mono);font-size:22px;font-weight:500}
.rr2 .line{font-size:15px;font-weight:500}
.rr2 .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.rr2{grid-template-columns:minmax(0,1fr)}.rr2 .acts{justify-content:flex-start}}
/* Payment + customer display */
.md.wide{width:min(940px,100%)}
.paygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
@media (max-width:780px){.paygrid{grid-template-columns:minmax(0,1fr)}}
.demo{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;color:var(--muted);font-size:12px}
.demo .row{flex-wrap:wrap}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.csw{display:grid;justify-items:center;align-content:center;gap:14px;min-height:calc(100dvh - 32px);padding-block:16px}
.csw>*{width:min(980px,100%)}
.csw .note{text-align:center;color:var(--muted);font-size:12px}
.cs{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:22px}
.cs .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cs .rest{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px}

function calc(lines,disc,st){
  var sub=sum(lines,function(l){return l.price*l.qty;});
  var d=0;
  if(disc&&disc.val>0){d=disc.type==='pct'?sub*Math.min(disc.val,100)/100:Math.min(disc.val,sub);}
  d=Math.round(d*100)/100;
  var base=sub-d, svc=base*st.service/100, gst=(base+svc)*st.gst/100, exact=base+svc+gst, total=Math.round(exact);
  return {sub:sub,disc:d,svc:svc,gst:gst,round:total-exact,total:total,gstPct:st.gst,svcPct:st.service};
}

function seed(){

  var categories=[{id:'st',name:'Starters'},{id:'br',name:'Biryani & Rice'},{id:'mn',name:'Mains'},{id:'bd',name:'Breads'},{id:'ds',name:'Desserts'},{id:'bv',name:'Beverages'}];

  function mk(t,status,paid,type,table){
    var n=1+Math.floor(rnd()*4), pick=[];
    while(pick.length<n){var m=menu[Math.floor(rnd()*menu.length)];if(pick.indexOf(m)<0)pick.push(m);}

  }

  var hours=[12,12,13,13,13,14,15,16,17,19,19,20,20,20,21,21,22], orders=[];
  for(var d=6;d>=1;d--){
    var n=20+Math.floor(rnd()*12);
    for(var i=0;i<n;i++){
      var t=startOfDay(d)+hours[Math.floor(rnd()*hours.length)]*3600e3+Math.floor(rnd()*60)*60e3;
      orders.push(mk(t,'done',true,pickType()));
    }
  }
  var mins=Math.max(2,Math.floor((now-startOfDay(0))/60000));
  [[7,'new',false,'dine','T3'],[11,'new',true,'delivery'],[16,'preparing',false,'dine','T7'],[24,'preparing',true,'take'],[31,'ready',false,'dine','T2'],

/* ---------- stock logic ---------- */
function needsFor(lines){
  var n={};
  lines.forEach(function(l){var m=menuById(l.id);if(!m)return;m.recipe.forEach(function(r){n[r.ing]=(n[r.ing]||0)+r.qty*l.qty;});});
  return n;
}
function shortfall(lines){
  var n=needsFor(lines);
  for(var id in n){var i=ingById(id);if(!i||i.stock+1e-9<n[id])return i?i.name:'an ingredient';}
  return null;
}
function maxPortions(m){
  if(!m.recipe.length)return 99;
  return Math.max(0,Math.min.apply(null,m.recipe.map(function(r){var i=ingById(r.ing);return i&&r.qty>0?Math.floor((i.stock+1e-9)/r.qty):0;})));
}
function itemState(m){
  if(!m.active)return 'off';
  var p=maxPortions(m);
  return p<=0?'out':p<=5?'low':'ok';
}
function applyStock(lines,sign,reason){
  var n=needsFor(lines);
  for(var id in n){
    var i=ingById(id);if(!i)continue;
    var d=round3(n[id])*sign;
    i.stock=Math.max(0,round3(i.stock-d));
    S.data.log.push({t:Date.now(),ing:id,name:i.name,delta:-d,reason:reason,who:who()});
  }
  if(S.data.log.length>200)S.data.log=S.data.log.slice(-200);
}
var ingStatus=function(i){return i.stock<=0?'out':i.stock<=i.reorder?'low':'ok';};
function busyTables(){
  var s=new Set();
  S.data.orders.forEach(function(o){if(o.type==='dine'&&o.table&&o.status!=='cancelled'&&(!o.paid||isOpen(o)))s.add(o.table);});
  return s;
}

function mshell(title,body,footer,form){
  var inner='<div class="mh"><h2>'+esc(title)+'</h2><button class="btn sm" type="button" data-act="close" aria-label="Close">'+icon('x',16)+'</button></div><div class="mb">'+body+'</div><div class="mf">'+footer+'</div>';
  return form?'<form data-form="'+form+'">'+inner+'</form>':inner;
}
function showModal(html,label,wide){
  $('#modal').innerHTML='<div class="ov" data-act="ovl"><div class="md'+(wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(label)+'">'+html+'</div></div>';
  var f=$('#modal input:not([type=hidden]),#modal select')||$('#modal .btn.primary');
  if(f)f.focus();
}
function closeModal(){var had=pay;$('#modal').innerHTML='';pay=null;pending=null;if(had&&!startedAsDisplay)pushScreen({mode:'idle'});}
function askConfirm(title,msg,label,fn){
  pending=fn;

  if(h==='display')return 'display';
  return allowed.indexOf(h)>=0?h:allowed[0];
}

  if(v==='display'){$('#app').innerHTML=viewDisplay();return;}
  var badge={online:(S.data.online||[]).filter(function(e){return e.status==='incoming';}).length,orders:S.data.orders.filter(isOpen).length,inventory:S.data.ingredients.filter(function(i){return i.stock<=i.reorder;}).length};

function head(title,sub,actions){
  return '<div class="ph"><div><h1>'+title+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>'+(actions?'<div class="row wrap">'+actions+'</div>':'')+'</div>';

/* Dashboard */
function barChart(data){
  var W=640,H=240,ml=46,mr=8,mt=18,mb=28;
  var max=Math.max.apply(null,data.map(function(d){return d.value;}).concat([0]));
  var step=niceStep(Math.max(max,1)/4), top=step*4, iw=W-ml-mr, ih=H-mt-mb, bw=iw/Math.max(data.length,1), g='', i, lstep=Math.max(1,Math.ceil(data.length/12));
  for(i=0;i<=4;i++){var y=mt+ih-ih*i/4;g+='<line class="gl" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'"/><text class="tx" x="'+(ml-8)+'" y="'+(y+4)+'" text-anchor="end">'+compact(step*i)+'</text>';}
  var mi=data.map(function(d){return d.value;}).indexOf(max);
  data.forEach(function(d,k){
    var h=ih*d.value/top,x=ml+k*bw+bw*.19,y=mt+ih-h;
    g+='<rect class="bar'+(k===mi&&max>0?' hi':'')+'" x="'+x+'" y="'+y+'" width="'+(bw*.62)+'" height="'+Math.max(h,0)+'" rx="3"><title>'+esc(d.full||d.label)+': '+inr(d.value)+'</title></rect>'+
      (k%lstep===0?'<text class="tx" x="'+(ml+k*bw+bw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(d.label)+'</text>':'');
  });
  if(max>0){var x2=ml+mi*bw+bw/2,y2=mt+ih-ih*data[mi].value/top;g+='<text class="tx hl" x="'+Math.min(Math.max(x2,ml+20),W-24)+'" y="'+(y2-6)+'" text-anchor="middle">'+compact(data[mi].value)+'</text>';}
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sales chart">'+g+'</svg>';
}
function viewDashboard(){
  var d=S.data, now=Date.now(), t0=startOfDay(0), r=ui.range, from=r==='today'?t0:t0-6*DAY;
  var live=d.orders.filter(function(o){return o.status!=='cancelled';});
  var cur=live.filter(function(o){return o.createdAt>=from;});
  var sales=sum(cur,function(o){return o.bill.total;}), cnt=cur.length, aov=cnt?sales/cnt:0, delta='';
  if(r==='today'){
    var prev=live.filter(function(o){return o.createdAt>=t0-DAY&&o.createdAt<=now-DAY;});
    var ps=sum(prev,function(o){return o.bill.total;});
    if(ps>0){var p=Math.round((sales-ps)/ps*100);delta='<span class="pill '+(p>=0?'good':'bad')+'">'+(p>=0?'↑':'↓')+' '+Math.abs(p)+'% vs same time yesterday</span>';}
  }
  var open=d.orders.filter(isOpen), unpaid=d.orders.filter(function(o){return !o.paid&&o.status!=='cancelled';});
  var mix=['dine','take','delivery'].map(function(k){return TYPE[k]+' '+cur.filter(function(o){return o.type===k;}).length;}).join(' · ');
  var data=[], i;
  if(r==='today'){
    var hrs=cur.map(function(o){return new Date(o.createdAt).getHours();});
    var lo=Math.min.apply(null,[10].concat(hrs)), hi=Math.max.apply(null,[22].concat(hrs));
    for(var h=lo;h<=hi;h++){(function(h){data.push({label:(h%12||12)+(h<12?'a':'p'),value:sum(cur.filter(function(o){return new Date(o.createdAt).getHours()===h;}),function(o){return o.bill.total;})});})(h);}
  }else{
    for(i=6;i>=0;i--){(function(i){var s=t0-i*DAY;data.push({label:new Date(s).toLocaleDateString('en-IN',{weekday:'short'}),value:sum(cur.filter(function(o){return o.createdAt>=s&&o.createdAt<s+DAY;}),function(o){return o.bill.total;})});})(i);}
  }
  var low=d.ingredients.filter(function(i){return i.stock<=i.reorder;}).sort(function(a,b){return a.stock/a.reorder-b.stock/b.reorder;}).slice(0,5);
  var lowMenu=d.menu.filter(function(m){var s=itemState(m);return s==='out'||s==='low';});
  var cnts={};cur.forEach(function(o){o.items.forEach(function(it){cnts[it.name]=(cnts[it.name]||0)+it.qty;});});
  var top=Object.keys(cnts).map(function(k){return [k,cnts[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
  var topMax=top.length?top[0][1]:1;
  var openList=open.slice().sort(function(a,b){return a.createdAt-b.createdAt;}).slice(0,6);
  var tools='<div class="seg" role="group" aria-label="Range"><button data-act="range" data-v="today" aria-pressed="'+(r==='today')+'">Today</button><button data-act="range" data-v="7d" aria-pressed="'+(r==='7d')+'">Last 7 days</button></div><button class="btn primary" data-act="go" data-v="pos">'+icon('plus',16)+' New order</button>';
  var kpis='<div class="kpis"><div class="card kpi"><span class="l">Sales</span><span class="v">'+inr(sales)+'</span><span class="s">'+(delta||'Before tax adjustments, incl. GST')+'</span></div>'+
    '<div class="card kpi"><span class="l">Orders</span><span class="v">'+cnt+'</span><span class="s">'+mix+'</span></div>'+
    '<div class="card kpi"><span class="l">Average bill</span><span class="v">'+inr(aov)+'</span><span class="s">Per order, all channels</span></div>'+
    '<div class="card kpi"><span class="l">Open now</span><span class="v">'+open.length+'</span><span class="s">'+unpaid.length+' unpaid bills, '+inr(sum(unpaid,function(o){return o.bill.total;}))+'</span></div></div>';
  var chart='<div class="card"><div class="row between wrap" style="margin-bottom:10px"><h2>'+(r==='today'?'Sales by hour':'Sales by day')+'</h2><span class="sub">'+(r==='today'?'Today':'Last 7 days')+'</span></div>'+barChart(data)+'</div>';
  var attn='<div class="card"><h2>Needs attention</h2>'+
    (low.length?low.map(function(i){var s=ingStatus(i);return '<div class="li"><div><div class="nm">'+esc(i.name)+'</div><div class="sub">'+num(i.stock)+' '+i.unit+' left, reorder at '+num(i.reorder)+'</div></div><div class="row"><span class="pill '+(s==='out'?'bad':'warn')+'">'+(s==='out'?'Out':'Low')+'</span>'+(ROLES[ui.role].views.indexOf('inventory')>=0?'<button class="btn sm" data-act="restock" data-id="'+i.id+'">Restock</button>':'')+'</div></div>';}).join(''):'<div class="empty small">All ingredients are above their reorder level.</div>')+
    (lowMenu.length?'<div class="lb" style="margin:14px 0 4px">Dishes affected</div>'+lowMenu.map(function(m){var p=maxPortions(m);return '<div class="li"><span><i class="vm '+(m.veg?'':'nv')+'"></i> '+esc(m.name)+'</span><span class="pill '+(p<=0?'bad':'warn')+'">'+(p<=0?'Unavailable':p+' left')+'</span></div>';}).join(''):'')+'</div>';
  var sellers='<div class="card"><h2>Top sellers</h2>'+(top.length?top.map(function(t){return '<div class="li"><div class="grow"><div class="row between"><span class="nm">'+esc(t[0])+'</span><span class="mono">'+t[1]+'</span></div><div class="sb"><i style="width:'+Math.round(t[1]/topMax*100)+'%"></i></div></div></div>';}).join(''):'<div class="empty small">No orders in this range yet.</div>')+'</div>';
  var liveCard='<div class="card"><div class="row between" style="margin-bottom:12px"><h2>Live orders</h2><button class="btn sm" data-act="go" data-v="orders">Open board</button></div>'+
    (openList.length?openList.map(function(o){var late=Date.now()-o.createdAt>20*60e3;return '<div class="li"><div><span class="mono">#'+o.no+'</span> <span class="sub">'+(whereLabel(o))+'</span></div><div class="row"><span class="pill '+(o.status==='new'?'info':o.status==='preparing'?'warn':'good')+'">'+({new:'New',preparing:'Preparing',ready:'Ready'}[o.status])+'</span><span class="sub'+(late?' late':'')+'">'+elapsed(o.createdAt)+'</span></div></div>';}).join(''):'<div class="empty small">No open orders. The kitchen is clear.</div>')+'</div>';
  return head('Dashboard',new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+' at '+esc(S.data.settings.name),tools)+
    '<div class="stack">'+kpis+'<div class="dgrid">'+chart+attn+'</div><div class="cols2">'+sellers+liveCard+'</div></div>';
}

/* Orders */
/* One table decides every order action. The board, the payment step and the action handlers all ask it. */
var STEP={new:{to:'preparing',perm:'start'},preparing:{to:'ready',perm:'ready'},ready:{to:'done',perm:'serve'}};
var STATUS_LABEL={new:'New',preparing:'Preparing',ready:'Ready',done:'Completed',cancelled:'Cancelled'};
function serveLabel(o){return o.source?'Hand to rider':o.type==='dine'?'Mark served':o.type==='take'?'Hand over':'Dispatch';}
function stepLabel(o){return o.status==='new'?'Start preparing':o.status==='preparing'?'Mark ready':serveLabel(o);}
function canAdvance(o,role){
  var st=STEP[o.status];
  if(!st)return {ok:false,why:'This order is already '+STATUS_LABEL[o.status].toLowerCase()+'.'};
  if(!ROLES[role].can[st.perm])return {ok:false,why:ROLES[role].label+' cannot '+stepLabel(o).toLowerCase()+'.'};
  if(st.perm==='serve'&&o.type!=='dine'&&!o.paid)return {ok:false,why:'Collect payment before you '+serveLabel(o).toLowerCase()+' a '+TYPE[o.type].toLowerCase()+' order.',unpaid:true};
  return {ok:true};
}
function canCancel(o,role){
  var c=ROLES[role].can;
  if(o.status==='new')return c.cancelNew?{ok:true}:{ok:false,why:ROLES[role].label+' cannot cancel orders.'};
  if(o.status==='preparing')return c.cancelPrep?{ok:true}:{ok:false,why:'Only the owner can cancel an order the kitchen has started.'};
  return {ok:false,why:'A '+STATUS_LABEL[o.status].toLowerCase()+' order cannot be cancelled.'};
}
function canPay(o,role){
  if(!ROLES[role].can.pay)return {ok:false,why:ROLES[role].label+' cannot collect payments.'};
  if(o.status==='cancelled')return {ok:false,why:'This order was cancelled.'};
  if(o.paid)return {ok:false,why:'This order is already paid.'};
  return {ok:true};
}
function waitingNote(o,role){
  var c=ROLES[role].can;
  if(o.status==='new'&&!c.start)return 'Waiting for the kitchen';
  if(o.status==='preparing'&&!c.ready)return 'Kitchen is preparing';
  if(o.status==='ready'&&!c.serve)return 'Waiting for pickup';
  return '';
}
function orderActions(o){
  var role=ui.role, act='', note='', adv=canAdvance(o,role);
  if(adv.ok)act+='<button class="btn sm primary" data-act="adv" data-id="'+o.id+'">'+stepLabel(o)+'</button>';
  else if(adv.unpaid)note='Collect payment before '+(o.type==='take'?'handing over':'dispatch');
  if(canPay(o,role).ok)act+='<button class="btn sm'+(adv.unpaid?' primary':'')+'" data-act="pay" data-id="'+o.id+'">Collect '+inr(o.bill.total)+'</button>';
  if(canCancel(o,role).ok)act+='<button class="btn sm danger" data-act="cancel" data-id="'+o.id+'">Cancel</button>';
  return {act:act,note:note||waitingNote(o,role)};
}
function orderCard(o){
  var c=ROLES[ui.role].can, a=orderActions(o);
  var where=whereLabel(o);
  var lateCls=isOpen(o)&&Date.now()-o.createdAt>20*60e3?' late':'';
  var items=o.items.map(function(i){return '<li><b>'+i.qty+'×</b><span>'+esc(i.name)+'</span></li>';}).join('');
  var money=c.prices?'<div class="ft"><span class="row"><b class="mono">'+inr(o.bill.total)+'</b>'+payPill(o)+'</span></div>':'';
  return '<article class="oc" data-order="'+o.no+'"><div class="hd"><span class="no'+(o.status==='cancelled'?' cx':'')+'">#'+o.no+'</span><span class="sub'+lateCls+'">'+(isOpen(o)?elapsed(o.createdAt):fmtTime(o.createdAt))+'</span></div>'+
    '<div class="row wrap"><span class="pill '+(o.type==='dine'?'accent':o.type==='take'?'info':'warn')+'">'+where+'</span>'+(o.customer&&c.prices?'<span class="sub">'+esc(o.customer.name)+'</span>':'')+'</div>'+
    '<ul>'+items+'</ul>'+(o.note?'<p class="onote">'+esc(o.note)+'</p>':'')+money+(a.note?'<p class="sub">'+a.note+'</p>':'')+
    (a.act?'<div class="acts">'+a.act+'</div>':'')+'</article>';
}
function payPill(o){return o.status==='cancelled'?'<span class="pill bad">Cancelled</span>':o.paid?'<span class="pill good">Paid · '+esc(o.payMode)+'</span>':'<span class="pill warn">Unpaid</span>';}
var STATUS_PILL={new:'info',preparing:'warn',ready:'good',done:'',cancelled:'bad'};

/* Search: order number first; phone (4+ digits) and name as fallbacks */
function orderMatches(o,q){
  var raw=q.trim().toLowerCase();if(!raw)return true;
  var alnum=raw.replace(/[^a-z0-9]/g,'');
  if(o.pid&&alnum.length>=5&&o.pid.toLowerCase().replace(/[^a-z0-9]/g,'').indexOf(alnum)>=0)return true;
  var d=raw.replace(/[#\s-]/g,'');
  if(/^\d+$/.test(d)){
    if(String(o.no).indexOf(d)>=0)return true;
    return d.length>=4&&!!o.customer&&String(o.customer.phone||'').replace(/\D/g,'').indexOf(d)>=0;
  }
  return !!o.customer&&o.customer.name.toLowerCase().indexOf(raw)>=0;
}
function statusLine(o){
  var mins=Math.round((Date.now()-o.createdAt)/60000);
  var prep=Math.max.apply(null,o.items.map(function(i){var m=menuById(i.id);return m?m.prep:10;}).concat([5]));
  var since=o.statusAt?elapsed(o.statusAt):'';
  var rem=prep-mins, eta=rem>0?'About '+rem+' min left':'Running '+(-rem)+' min over the usual prep time';
  if(o.status==='new')return {line:'Waiting for the kitchen to start',sub:eta};
  if(o.status==='preparing')return {line:'Kitchen is preparing'+(since?' (for '+since+')':''),sub:eta};

  if(o.status==='done')return {line:(o.type==='dine'?'Served':o.type==='take'?'Handed over':'Dispatched')+(o.statusAt?' at '+fmtTime(o.statusAt):''),sub:'Placed '+fmtDay(o.createdAt)};

function ordersBody(){

  var old=SS.get('tw-pairing'),deviceId=(old&&old.deviceId)||uid('dev-');
  var p={deviceId:deviceId,code:String(Math.floor(100000+Math.random()*900000)),exp:Date.now()+10*60e3};

function displaySync(){
  if(!startedAsDisplay)return false;
  var d=dev(),list=readDevices();
  if(d){
    var rec=list.filter(function(x){return x.token===d.token;})[0];
    if(!rec){SS.del('tw-device');SS.del('tw-pairing');return true;}
    var pr=presence();pr[d.deviceId]=Date.now();lsSet(PRKEY,pr);
    if(rec.counter!==d.counter||rec.name!==d.name){d.counter=rec.counter;d.name=rec.name;SS.set('tw-device',d);return true;}
    return false;
  }
  var p=pairing(),mine=list.filter(function(x){return x.deviceId===p.deviceId;})[0];
  if(mine){SS.set('tw-device',{deviceId:mine.deviceId,token:mine.token,counter:mine.counter,name:mine.name});SS.del('tw-pairing');
    var pr2=presence();pr2[mine.deviceId]=Date.now();lsSet(PRKEY,pr2);return true;}

}

function qrSvg(seedStr){

  var r=mulberry32(h);
  function inF(x,y){return (x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);}
  for(y=0;y<n;y++)for(x=0;x<n;x++){if(!inF(x,y)&&r()<.5)d+='M'+x+' '+y+'h1v1h-1z';}
  function fp(x,y){return '<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#111"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#111"/>';}
  return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" role="img" aria-label="Sample QR code, not scannable" shape-rendering="crispEdges"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/>'+fp(0,0)+fp(n-7,0)+fp(0,n-7)+'<path fill="#111" d="'+d+'"/></svg>';

  S.data.orders.push(o);st.nextNo++;
  applyStock(items.map(function(i){return {id:i.id,qty:i.qty};}),1,PLAT[e.platform].label+' order '+e.pid);
  e.status='accepted';e.orderId=o.id;e.acceptedAt=now;e.prep=prep;e.rider=RIDERS[Math.floor(Math.random()*RIDERS.length)];
  return o;
}
function initOnline(){
  if(!S.data.platforms)S.data.platforms={swiggy:{on:true},zomato:{on:true},web:{on:true}};
  if(S.data.online)return;
  S.data.online=[];var now=Date.now();
  var a=makeOnline('zomato',now-14*60e3),o=acceptOnline(a,20,now-13*60e3);o.status='preparing';o.statusAt=now-9*60e3;
  makeOnline('swiggy',now-55e3);makeOnline('web',now-20e3);
}
/* The platform owns delivery and rider tracking. The outlet only shows its own kitchen progress against the promised time. */
function riderLine(e,o){
  var mins=(Date.now()-e.acceptedAt)/60000,left=Math.round(e.prep-mins);
  if(o.status==='cancelled')return 'Cancelled after acceptance';
  if(o.status==='done')return 'Handed to the rider'+(o.statusAt?' at '+fmtTime(o.statusAt):'');
  if(o.status==='ready')return 'Ready. Hand it over when the rider arrives';
  var when=left>0?'due in '+left+' min':(-left)+' min past the promised time';
  return (o.status==='new'?'Waiting for the kitchen':'Kitchen is preparing')+', '+when;
}

function normAnchor(mode,t,basis){return mode==='day'?sod(t):mode==='month'?monthStart(t):mode==='quarter'?qStart(t):yStart(t,basis);}

function periodOf(mode,a,basis){

  else if(mode==='quarter'){end=addDays(addMonths(a,3),-1);var mn=fmtD(a,{month:'short'})+'–'+fmtD(end,{month:'short'});
    label=basis==='fy'?'Q'+(Math.floor(((m+9)%12)/3)+1)+' FY '+fyLabel(m>=3?y:y-1)+' ('+mn+')':'Q'+(Math.floor(m/3)+1)+' '+y+' ('+mn+')';}

function repRange(){
  var r=ui.rep,today=startOfDay(0),p;
  if(!r.anchor)r.anchor=monthStart(today);

  p.to=Math.min(p.end,today);p.partial=p.end>today;p.clipped=p.from<HIST_START;p.from=Math.max(p.from,HIST_START);
  p.empty=p.to<p.from;p.days=p.empty?0:dayDiff(p.from,p.to)+1;return p;

function repCompare(cur){

  if(r.compare==='yoy'){f=shiftYear(cur.from,-1);t=shiftYear(cur.to,-1);label='the same period last year';}
  else if(r.mode==='custom'){t=addDays(cur.from,-1);f=addDays(t,-(cur.days-1));label='the previous '+cur.days+' days';}
  else{var pp=periodOf(r.mode,stepAnchor(r.mode,r.anchor,-1),r.basis);f=pp.from;t=Math.min(pp.end,addDays(pp.from,dayDiff(cur.anchorFrom,cur.to)));label=pp.label.replace(/ \(.*\)$/,'');}

var synthCache={};
function emptyStats(){return {orders:0,gross:0,disc:0,taxable:0,gst:0,total:0,ch:{},pay:{},items:{},isales:{},inames:{}};}
/* Earlier history is generated from a fixed seed, so every report for the same dates shows the same numbers */
function synthDay(t){
  var d=new Date(t),k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  if(synthCache[k])return synthCache[k];
  var r=mulberry32(k),months=(d.getFullYear()-2025)*12+d.getMonth()-3,dow=d.getDay(),m=d.getMonth();
  var f=(dow===0||dow===6?1.35:dow===5?1.15:dow===1?0.85:1)*(1+0.018*months)*(m===9||m===10?1.12:m===11?1.08:(m>=5&&m<=7)?0.93:1)*(0.85+r()*0.3);
  var x=emptyStats();
  Object.keys(WEIGHT).forEach(function(id){var q=Math.round(WEIGHT[id]*0.36*f*(0.6+r()*0.8));if(q>0){x.items[id]=q;x.isales[id]=q*MENU_INFO[id].price;x.gross+=q*MENU_INFO[id].price;}});
  x.disc=Math.round(x.gross*0.015*r());x.taxable=x.gross-x.disc;x.gst=Math.round(x.taxable*5)/100;x.total=Math.round(x.taxable+x.gst);
  var orders=Math.max(1,Math.round(x.gross/(440+r()*80))),mon=(m>=5&&m<=8)?1.25:1;
  var sh={dine:0.5/mon,take:0.17,own:0.08*mon,swiggy:0.15*mon,zomato:0.10*mon},tot=0,c;
  for(c in sh){sh[c]*=0.85+r()*0.3;tot+=sh[c];}
  for(c in sh){var o=Math.round(orders*sh[c]/tot);x.ch[c]={o:o,s:x.total*sh[c]/tot};x.orders+=o;}
  if(!x.orders){x.orders=1;x.ch.dine.o=1;}
  var online=(sh.swiggy+sh.zomato)/tot,rest=1-online,upi=Math.min(0.62,0.48+0.004*months);
  x.pay['Online (platform)']=x.total*online;x.pay.UPI=x.total*rest*upi;x.pay.Card=x.total*rest*0.14;x.pay.Cash=x.total*rest*(1-upi-0.14);
  return synthCache[k]=x;
}
function realDay(t){
  var end=addDays(t,1),x=emptyStats();

    if(o.status==='cancelled'||o.createdAt<t||o.createdAt>=end)return;
    var b=o.bill,c=o.source||(o.type==='delivery'?'own':o.type),pm=!o.paid?'Unpaid':o.source?'Online (platform)':o.payMode;
    x.orders++;x.gross+=b.sub;x.disc+=b.disc;x.taxable+=b.sub-b.disc+(b.svc||0);x.gst+=b.gst;x.total+=b.total;
    x.ch[c]=x.ch[c]||{o:0,s:0};x.ch[c].o++;x.ch[c].s+=b.total;
    x.pay[pm]=(x.pay[pm]||0)+b.total;
    o.items.forEach(function(i){x.items[i.id]=(x.items[i.id]||0)+i.qty;x.isales[i.id]=(x.isales[i.id]||0)+i.price*i.qty;x.inames[i.id]=i.name;});
  });

function dayStats(t){return t>=addDays(S.data.seededDay,-6)?realDay(t):synthDay(t);}
function bucketOf(t,g){

  if(g==='week'){var ws=addDays(t,-((new Date(t).getDay()+6)%7));return {key:ws,label:fmtD(ws,{day:'numeric',month:'short'}),full:'Week of '+fmtD(ws,{day:'numeric',month:'short',year:'numeric'})};}

var SUMK=['orders','gross','disc','taxable','gst','total'];
function aggregate(from,to,gran){
  var A=emptyStats(),bmap={},t,k;A.buckets=[];
  for(t=from;t<=to;t=addDays(t,1)){
    var x=dayStats(t);

    for(k in x.ch){A.ch[k]=A.ch[k]||{o:0,s:0};A.ch[k].o+=x.ch[k].o;A.ch[k].s+=x.ch[k].s;}
    for(k in x.pay)A.pay[k]=(A.pay[k]||0)+x.pay[k];
    for(k in x.items){A.items[k]=(A.items[k]||0)+x.items[k];A.isales[k]=(A.isales[k]||0)+x.isales[k];}
    for(k in x.inames)A.inames[k]=x.inames[k];

      if(!bb){bb=bmap[bk.key]={label:bk.label,full:bk.full,start:t,orders:0,gross:0,disc:0,taxable:0,gst:0,total:0};A.buckets.push(bb);}

function buildCsv(kind){
  var cur=repRange(),cmp=repCompare(cur),A=aggregate(cur.from,cur.to,'day'),Pv=cmp&&!cmp.none?aggregate(cmp.from,cmp.to,null):null,rows=[];
  var period=cur.label+' ('+ymd(cur.from)+' to '+ymd(cur.to)+')';
  if(kind==='summary'){
    rows.push([S.data.settings.name+' sales summary']);rows.push(['Period',period]);
    if(Pv)rows.push(['Compared with',cmp.label+' ('+ymd(cmp.from)+' to '+ymd(cmp.to)+')']);
    rows.push([]);rows.push(['Metric','Value'].concat(Pv?['Comparison','Change %']:[]));
    [['Net sales (incl. GST)','total'],['Orders','orders'],['Gross sales (before discount)','gross'],['Discounts','disc'],['Taxable value','taxable'],['GST','gst']].forEach(function(m){
      var v=A[m[1]],pv=Pv?Pv[m[1]]:0;rows.push([m[0],m[1]==='orders'?v:n2(v)].concat(Pv?[m[1]==='orders'?pv:n2(pv),pv?((v-pv)/pv*100).toFixed(1):'']:[]));});
    var av=A.orders?A.total/A.orders:0,pa=Pv&&Pv.orders?Pv.total/Pv.orders:0;rows.push(['Average bill',n2(av)].concat(Pv?[n2(pa),pa?((av-pa)/pa*100).toFixed(1):'']:[]));
    rows.push([]);rows.push(['Channel','Orders','Sales']);Object.keys(CH_LABEL).forEach(function(c){if(A.ch[c]&&A.ch[c].o)rows.push([CH_LABEL[c],A.ch[c].o,n2(A.ch[c].s)]);});
    rows.push([]);rows.push(['Payment mode','Amount']);PAY_LABEL.forEach(function(p){if(A.pay[p])rows.push([p,n2(A.pay[p])]);});
    rows.push([]);rows.push(['GST summary','Amount']);[['Taxable value',A.taxable],['CGST',A.gst/2],['SGST',A.gst/2],['Total GST',A.gst],['Invoice value',A.total]].forEach(function(x){rows.push([x[0],n2(x[1])]);});
  }else if(kind==='daywise'){
    rows.push(['Date','Orders','Gross sales','Discount','Taxable value','GST','Total']);
    A.buckets.forEach(function(b){rows.push([ymd(b.start),b.orders,n2(b.gross),n2(b.disc),n2(b.taxable),n2(b.gst),n2(b.total)]);});

  }

}

function repSetRange(el,which){
  var r=ui.rep,t=parseYmd(el.value),today=startOfDay(0);
  if(t==null){el.value=r[which];return;}
  t=Math.min(Math.max(t,HIST_START),today);
  var f=which==='from'?t:parseYmd(r.from),to=which==='to'?t:parseYmd(r.to);
  if(f>to){el.value=r[which];return toast('The start date must be on or before the end date');}
  if(dayDiff(f,to)>730){el.value=r[which];return toast('Choose a range of 2 years or less');}
  r[which]=ymd(t);r.preset='';render();
}
function applyPreset(p){
  var r=ui.rep,today=startOfDay(0);r.preset=p;
  if(p==='today'){r.mode='day';r.anchor=today;}
  else if(p==='yesterday'){r.mode='day';r.anchor=addDays(today,-1);}
  else if(p==='last7'||p==='last30'){r.mode='custom';r.from=ymd(addDays(today,p==='last7'?-6:-29));r.to=ymd(today);}
  else if(p==='thisMonth'){r.mode='month';r.anchor=monthStart(today);}
  else if(p==='lastMonth'){r.mode='month';r.anchor=addMonths(today,-1);}
  else if(p==='thisQuarter'){r.mode='quarter';r.anchor=qStart(today);}
  else if(p==='thisFY'){r.mode='year';r.basis='fy';r.anchor=yStart(today,'fy');}
}

    askConfirm('Remove '+esc(d.name)+'?','The tablet is signed out straight away and shows a new pairing code. Until you pair another display, payments at '+counterName(d.counter)+' show only on the cashier screen.','Remove display',function(){
      S.data.devices=S.data.devices.filter(function(x){return x!==d;});save();devMsg({t:'revoked'});render();toast(d.name+' removed and signed out');
    });
  },
  goDevices:function(){closeModal();go('admin');var c=$('#dev-card');if(c&&c.scrollIntoView)c.scrollIntoView({block:'start'});},
  qrprint:function(){toast('Bill with this QR sent to the printer (prototype)');},
  qrlink:function(){var o=orderById(pay.id);if(o.customer&&validPhone(o.customer.phone))toast('Payment link sent to '+o.customer.phone+' by SMS (prototype)');else toast('This order has no customer phone. Add one when taking the order to send a link.');},
  onTab:function(t){ui.onTab=t.dataset.v;render();},
  platToggle:function(t){var p=S.data.platforms[t.dataset.v];p.on=!p.on;save();render();toast(PLAT[t.dataset.v].label+(p.on?' is accepting orders again':' is paused. Customers cannot order until you switch it back on.'));},
  onlineSim:function(){
    var open=Object.keys(PLAT).filter(function(p){return S.data.platforms[p].on;});
    if(!open.length)return toast('All platforms are paused. Switch one on to receive orders.');
    var e=makeOnline(open[Math.floor(Math.random()*open.length)],Date.now());
    if(!e.items.length){S.data.online.pop();return toast('No dishes are in stock to order');}
    save();ui.onTab='incoming';render();toast('New '+PLAT[e.platform].label+' order: '+e.items.length+' item'+(e.items.length>1?'s':'')+', '+inr(calc(e.items,null,S.data.settings).total));
  },
  oprep:function(t){ui.oprep[t.dataset.id]=+t.dataset.v;render();},
  oaccept:function(t){
    var e=S.data.online.filter(function(x){return x.id===t.dataset.id;})[0];if(!e)return;
    if(!ROLES[ui.role].can.take)return toast(ROLES[ui.role].label+' cannot accept online orders.');
    if(e.status!=='incoming'||e.expiresAt<Date.now()){render();return toast('This order is no longer waiting for acceptance.');}
    var prob=onlineProblem(e);if(prob){render();return toast(prob+'. Reject the order or update stock first.');}
    var o=acceptOnline(e,ui.oprep[e.id]||defaultPrep(e));save();render();
    toast('Accepted. '+PLAT[e.platform].label+' order is now #'+o.no+' in the kitchen, ready in '+e.prep+' min.');
  },
  oreject:function(t){
    var e=S.data.online.filter(function(x){return x.id===t.dataset.id;})[0];if(!e)return;
    if(!ROLES[ui.role].can.take)return toast(ROLES[ui.role].label+' cannot reject online orders.');
    var prob=onlineProblem(e),reasons=['Item out of stock','Kitchen is too busy','Closing soon','Delivery area not served'];
    var body='<input type="hidden" name="id" value="'+e.id+'"><p>'+PLAT[e.platform].label+' order <span class="mono">'+esc(e.pid)+'</span> for '+esc(e.customer)+'.</p><div class="stack" style="gap:8px">'+reasons.map(function(r,i){return '<label class="opt"><input type="radio" name="reason" value="'+r+'"'+((prob?i===0:i===1)?' checked':'')+'><span>'+r+'</span></label>';}).join('')+'</div><p class="sub">The platform tells the customer and refunds them. Frequent rejections can lower your ranking on the platform.</p>';
    showModal(mshell('Reject this order?',body,'<button class="btn" type="button" data-act="close">Keep order</button><button class="btn primary" type="submit">Reject order</button>','onlineReject'),'Reject online order');
  },
  repMode:function(t){
    var r=ui.rep,cur=repRange(),v=t.dataset.v;r.preset='';
    if(v==='custom'){r.from=ymd(cur.from);r.to=ymd(cur.to);}
    else r.anchor=normAnchor(v,cur.empty?startOfDay(0):cur.to,r.basis);
    r.mode=v;render();
  },
  repBasis:function(t){var r=ui.rep,cur=repRange();r.basis=t.dataset.v;r.preset='';if(r.mode==='year')r.anchor=yStart(cur.empty?startOfDay(0):cur.to,r.basis);render();},
  repStep:function(t){var r=ui.rep,a=stepAnchor(r.mode,r.anchor,+t.dataset.v);if(a>startOfDay(0))return;r.anchor=a;r.preset='';render();},
  repPreset:function(t){applyPreset(t.dataset.v);render();},
  repCmp:function(t){ui.rep.compare=t.dataset.v;render();},
  repExport:function(){
    var cur=repRange();
    var body='<p><b>'+esc(cur.label)+'</b> · '+fmtRange(cur.from,cur.to)+'</p><div class="stack" style="gap:8px">'+[['summary','Sales summary','Totals, channels, payment modes and GST'],['daywise','Day-wise sales','One row per day with taxable value, GST and total'],['itemwise','Dish-wise sales','Quantity and sales for every dish']].map(function(k,i){return '<label class="opt"><input type="radio" name="kind" value="'+k[0]+'"'+(i===0?' checked':'')+'><span><b>'+k[1]+'</b><br><span class="sub">'+k[2]+'</span></span></label>';}).join('')+'</div><p class="sub">Files are CSV, which opens in Excel and Google Sheets.</p>';
    showModal(mshell('Export report',body,'<button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Download CSV</button>','repExport'),'Export report');
  },
  csvcopy:function(){
    var ta=$('#csvtxt');if(!ta)return;
    var sel=function(){ta.focus();ta.select();toast('Text selected. Press Ctrl+C or Cmd+C to copy.');};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(function(){toast('CSV copied');},sel);else sel();}catch(e){sel();}
  },
  otype:function(t){ui.ordType=t.dataset.v;render();},
  ounpaid:function(){ui.ordUnpaid=!ui.ordUnpaid;render();},
  confirmYes:function(){var f=pending;closeModal();if(f)f();},
  /* menu */
  mtoggle:function(t){var m=menuById(t.dataset.id);m.active=!m.active;save();render();toast(m.name+(m.active?' is available again':' is switched off'));},
  madd:function(){showModal(menuForm({id:'',name:'',cat:S.data.categories[0]?S.data.categories[0].id:'',price:'',prep:'',veg:true,recipe:[{ing:'',qty:''}]}),'Add dish');},
  medit:function(t){var m=menuById(t.dataset.id);showModal(menuForm({id:m.id,name:m.name,cat:m.cat,price:m.price,prep:m.prep,veg:m.veg,recipe:m.recipe.map(function(r){return {ing:r.ing,qty:r.qty};})}),'Edit dish');},
  mdel:function(t){var m=menuById(t.dataset.id);askConfirm('Delete '+esc(m.name)+'?','The dish disappears from the menu. Past orders keep their line items.','Delete dish',function(){S.data.menu=S.data.menu.filter(function(x){return x.id!==m.id;});S.cart.items=S.cart.items.filter(function(l){return l.id!==m.id;});save();render();toast(m.name+' deleted');});},
  radd:function(t){var f=t.closest('form'),d=readMenuForm(f);d.recipe.push({ing:'',qty:''});$('#modal .md').innerHTML=menuForm(d);},
  rdel:function(t){var f=t.closest('form'),d=readMenuForm(f);d.recipe.splice(+t.dataset.i,1);$('#modal .md').innerHTML=menuForm(d);},
  /* inventory */
  itab:function(t){ui.invTab=t.dataset.v;render();},
  ifilter:function(t){ui.invF=t.dataset.v;render();},
  iadd:function(){showModal(ingForm({id:'',name:'',unit:'kg',stock:'',reorder:'',cost:'',supplier:''}),'Add ingredient');},
  iedit:function(t){showModal(ingForm(ingById(t.dataset.id)),'Edit ingredient');},
  idel:function(t){
    var i=ingById(t.dataset.id),used=S.data.menu.filter(function(m){return m.recipe.some(function(r){return r.ing===i.id;});});
    if(used.length)return toast(i.name+' is used by '+used.length+' dish'+(used.length>1?'es':'')+'. Remove it from those recipes first.');
    askConfirm('Delete '+esc(i.name)+'?','Its stock record and movement history stay in the log.','Delete ingredient',function(){S.data.ingredients=S.data.ingredients.filter(function(x){return x.id!==i.id;});save();render();toast(i.name+' deleted');});
  },
  restock:function(t){
    var i=ingById(t.dataset.id);if(!i)return;
    var body='<input type="hidden" name="id" value="'+i.id+'"><p>In stock now: <b class="mono">'+num(i.stock)+' '+i.unit+'</b> · reorder at '+num(i.reorder)+' '+i.unit+'</p><div class="fg"><div class="fld"><label for="r-q">Quantity received ('+i.unit+')</label><input id="r-q" name="qty" type="number" min="0" step="any" required></div><div class="fld"><label for="r-n">Note</label><input id="r-n" name="note" placeholder="Invoice or supplier"></div></div>';
    showModal(mshell('Restock '+i.name,body,'<button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Add to stock</button>','restock'),'Restock');
  },
  /* admin */
  catdel:function(t){
    var c=S.data.categories.filter(function(x){return x.id===t.dataset.id;})[0],n=S.data.menu.filter(function(m){return m.cat===c.id;}).length;
    if(n)return toast('Move or delete the '+n+' dishes in '+c.name+' first.');
    S.data.categories=S.data.categories.filter(function(x){return x!==c;});save();render();toast(c.name+' removed');
  },
  sadd:function(){
    var body='<div class="fg"><div class="fld"><label for="n-name">Name</label><input id="n-name" name="name" required></div><div class="fld"><label for="n-role">Role</label><select id="n-role" name="role">'+Object.keys(ROLES).map(function(k){return '<option value="'+k+'">'+ROLES[k].label+'</option>';}).join('')+'</select></div></div>';
    showModal(mshell('Invite staff',body,'<button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Add staff member</button>','staff'),'Invite staff');
  },
  stoggle:function(t){var s=S.data.staff.filter(function(x){return x.id===t.dataset.id;})[0];s.active=!s.active;save();render();},
  reset:function(){askConfirm('Reset sample data?','Menu, stock, orders and settings return to their starting values. Your changes are lost.','Reset',function(){S.data=seed();S.cart=freshCart();save();render();toast('Sample data restored');});}
};

var FORMS={
  menuItem:function(f){
    var d=readMenuForm(f);
    if(!d.name)return toast('Give the dish a name');
    if(d.price<=0)return toast('Enter a price above zero');
    var rec=d.recipe.filter(function(r){return r.ing;}),seen={};
    for(var i=0;i<rec.length;i++){
      if(rec[i].qty<=0)return toast('Enter a quantity for each ingredient');
      if(seen[rec[i].ing])return toast('Each ingredient can appear once per dish');
      seen[rec[i].ing]=1;
    }
    var m=d.id?menuById(d.id):null;
    if(m){m.name=d.name;m.cat=d.cat;m.price=d.price;m.prep=d.prep;m.veg=d.veg;m.recipe=rec;}
    else S.data.menu.push({id:uid('m'),name:d.name,cat:d.cat,price:d.price,prep:d.prep,veg:d.veg,active:true,recipe:rec});
    save();closeModal();render();toast(d.name+(m?' updated':' added to the menu'));
  },
  ingredient:function(f){
    var fd=new FormData(f),id=fd.get('id'),name=String(fd.get('name')||'').trim();
    if(!name)return toast('Give the ingredient a name');
    var v={name:name,unit:fd.get('unit'),stock:Math.max(0,parseFloat(fd.get('stock'))||0),reorder:Math.max(0,parseFloat(fd.get('reorder'))||0),cost:Math.max(0,parseFloat(fd.get('cost'))||0),supplier:String(fd.get('supplier')||'').trim()};
    if(id){
      var i=ingById(id),diff=round3(v.stock-i.stock);
      if(diff!==0)S.data.log.push({t:Date.now(),ing:i.id,name:v.name,delta:diff,reason:'Manual correction',who:who()});
      Object.assign(i,v);
    }else{
      var n=Object.assign({id:uid('i')},v);S.data.ingredients.push(n);
      if(v.stock>0)S.data.log.push({t:Date.now(),ing:n.id,name:n.name,delta:v.stock,reason:'Opening stock',who:who()});
    }
    save();closeModal();render();toast(name+(id?' updated':' added'));
  },
  restock:function(f){
    var fd=new FormData(f),i=ingById(fd.get('id')),q=parseFloat(fd.get('qty'))||0,note=String(fd.get('note')||'').trim();
    if(!i||q<=0)return toast('Enter the quantity received');
    i.stock=round3(i.stock+q);
    S.data.log.push({t:Date.now(),ing:i.id,name:i.name,delta:q,reason:'Restock'+(note?': '+note:''),who:who()});
    save();closeModal();render();toast('Added '+num(q)+' '+i.unit+' of '+i.name);
  },
  settings:function(f){
    var fd=new FormData(f),st=S.data.settings,name=String(fd.get('name')||'').trim();
    if(!name)return toast('Restaurant name cannot be empty');
    st.name=name;st.gst=Math.min(28,Math.max(0,parseFloat(fd.get('gst'))||0));st.service=Math.min(20,Math.max(0,parseFloat(fd.get('service'))||0));st.tables=Math.min(40,Math.max(1,parseInt(fd.get('tables'),10)||1));st.counters=Math.min(6,Math.max(1,parseInt(fd.get('counters'),10)||1));if(parseInt(ui.counter.slice(1),10)>st.counters){ui.counter='c1';SS.set('tw-terminal','c1');}
    if(S.cart.table&&parseInt(S.cart.table.slice(1),10)>st.tables)S.cart.table=null;
    save();render();toast('Settings saved. New bills use these rates.');
  },
  pairDevice:function(f){
    var fd=new FormData(f),code=String(fd.get('code')||'').replace(/\D/g,''),counter=fd.get('counter'),name=String(fd.get('name')||'').trim()||counterName(counter)+' display';
    if(code.length!==6)return toast('Enter the 6-digit code shown on the tablet');
    var map=lsGet(PKEY,{}),p=map[code];
    if(!p||p.exp<Date.now())return toast('That code was not found or has expired. Check the code on the tablet and try again.');
    var d={id:uid('d'),deviceId:p.deviceId,name:name,counter:counter,token:'tok_'+uid('')+uid(''),pairedAt:Date.now()};
    S.data.devices=S.data.devices.filter(function(x){return x.deviceId!==p.deviceId;});
    S.data.devices.push(d);delete map[code];lsSet(PKEY,map);save();devMsg({t:'paired'});
    closeModal();render();toast(name+' paired. Payments at '+counterName(counter)+' now show on it.');
  },
  onlineReject:function(f){
    var fd=new FormData(f),e=S.data.online.filter(function(x){return x.id===fd.get('id');})[0];if(!e)return closeModal();
    if(e.status!=='incoming'){closeModal();render();return toast('This order is no longer waiting for a decision.');}
    e.status='rejected';e.reason=String(fd.get('reason')||'Not given');save();closeModal();render();toast('Rejected. '+PLAT[e.platform].label+' will tell the customer.');
  },
  repExport:function(f){
    var kind=new FormData(f).get('kind')||'summary',x=buildCsv(kind);closeModal();
    getDl().then(function(dl){
      if(!dl)return csvFallback(x);
      return dl.save({filename:x.name,data:x.csv}).then(function(){toast('Saved '+x.name);},function(err){
        var c=err&&err.code;
        if(c==='declined')toast('Download cancelled');
        else if(c==='rate_limited')toast('A download is already waiting for your confirmation');
        else csvFallback(x);
      });
    });
  },
  catAdd:function(f){
    var name=String(new FormData(f).get('name')||'').trim();if(!name)return;
    S.data.categories.push({id:uid('c'),name:name});save();render();toast(name+' added');
  },
  staff:function(f){
    var fd=new FormData(f),name=String(fd.get('name')||'').trim();if(!name)return toast('Enter the staff member’s name');
    S.data.staff.push({id:uid('s'),name:name,role:fd.get('role'),active:true,last:'Never'});save();closeModal();render();toast(name+' added as '+ROLES[fd.get('role')].label);
  }
};

var INP={
  pq:function(el){ui.posQ=el.value;$('#items').innerHTML=posItemsHtml();},
  cname:function(el){S.cart.name=el.value;},
  cphone:function(el){S.cart.phone=el.value;},
  dval:function(el){S.cart.dval=el.value;$('#cart-totals').innerHTML=totalsHtml();$('#place').textContent='Send to kitchen · '+inr(cartBill().total);},
  mq:function(el){ui.menuQ=el.value;$('#menu-rows').innerHTML=menuRowsHtml();},
  iq:function(el){ui.invQ=el.value;$('#inv-rows').innerHTML=invRowsHtml();},
  cq:function(el){ui.custQ=el.value;$('#cust-rows').innerHTML=custRowsHtml();},
  oq:function(el){ui.ordQ=el.value;$('#ord-body').innerHTML=ordersBody();},
  tend:function(el){pay.tendered=el.value;var o=orderById(pay.id),t=parseFloat(el.value)||0,c=$('#change'),b=$('#cashok');if(c)c.textContent=t>=o.bill.total?inr2(t-o.bill.total):'–';if(b)b.disabled=t<o.bill.total;}
};
var CHG={
  role:function(el){ui.role=el.value;if(ROLES[ui.role].views.indexOf(location.hash.slice(1))<0)location.hash=ROLES[ui.role].views[0];render();toast('Now viewing as '+ROLES[ui.role].label);},
  term:function(el){ui.counter=el.value;SS.set('tw-terminal',ui.counter);render();toast('This terminal is now '+counterName(ui.counter)+'. Payments show on its display.');},
  devCounter:function(el){var d=S.data.devices.filter(function(x){return x.id===el.dataset.id;})[0];if(!d)return;d.counter=el.value;save();devMsg({t:'changed'});toast(d.name+' now shows payments from '+counterName(d.counter));},
  repSel:function(el){ui.rep.anchor=+el.value;ui.rep.preset='';render();},
  repDay:function(el){var t=parseYmd(el.value);if(t==null)return;t=Math.min(Math.max(t,HIST_START),startOfDay(0));ui.rep.anchor=t;ui.rep.preset='';render();},
  repFrom:function(el){repSetRange(el,'from');},
  repTo:function(el){repSetRange(el,'to');},
  dtype:function(el){S.cart.dtype=el.value;$('#cart-totals').innerHTML=totalsHtml();$('#place').textContent='Send to kitchen · '+inr(cartBill().total);},
  mcat:function(el){ui.menuCat=el.value;$('#menu-rows').innerHTML=menuRowsHtml();},
  catName:function(el){var c=S.data.categories.filter(function(x){return x.id===el.dataset.id;})[0];var v=el.value.trim();if(!v){el.value=c.name;return;}c.name=v;save();toast('Category renamed');}
};

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  if(t.tagName==='A')e.preventDefault();
  var fn=A[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('input',function(e){var k=e.target.dataset&&e.target.dataset.in;if(k&&INP[k])INP[k](e.target);});
document.addEventListener('change',function(e){var k=e.target.dataset&&e.target.dataset.chg;if(k&&CHG[k])CHG[k](e.target);});
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();FORMS[f.dataset.form](f);});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#modal .ov'))return closeModal();
  var a=document.activeElement,typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
  if(e.key==='/'&&!typing&&!$('#modal .ov')&&currentView()==='orders'){var i=$('#oq');if(i){e.preventDefault();i.focus();i.select();}}
  if(e.key==='Escape'&&a&&a.id==='oq'&&ui.ordQ){ui.ordQ='';a.value='';$('#ord-body').innerHTML=ordersBody();}
});
window.addEventListener('hashchange',render);
window.addEventListener('storage',function(e){
  if(e.key&&e.key.indexOf(SKEY+':')===0){if(currentView()==='display')render();}
  else if(e.key===MKEY&&startedAsDisplay){if(displaySync())render();}
  else if(e.key===EKEY&&e.newValue){try{handleEvent(JSON.parse(e.newValue));}catch(x){}}
});
if(BC)BC.onmessage=function(m){
  var d=m.data||{};
  if(d.t==='screen'){if(d.sc)memScreens[d.sc.counter]=d.sc;if(currentView()==='display')render();}
  else if(d.t==='dev'&&startedAsDisplay){if(displaySync())render();}
  else if(d.t==='event')handleEvent(d.ev);
};
setInterval(function(){
  var now=Date.now();
  document.querySelectorAll('[data-countdown]').forEach(function(el){var ms=+el.dataset.countdown-now;el.textContent=ms>0?cdown(ms):'Expired';});
  if(!startedAsDisplay&&pay&&pay.mode==='upi'&&pay.status==='waiting'&&now>pay.expiresAt){pay.status='expired';if($('#modal .md'))refreshPay();}
  if(!startedAsDisplay&&S.data.online){
    var missed=S.data.online.filter(function(e){return e.status==='incoming'&&e.expiresAt<now;});
    if(missed.length){missed.forEach(function(e){e.status='missed';toast(PLAT[e.platform].label+' order '+e.pid+' was not accepted in time and was cancelled');});save();
      var ae=document.activeElement;if(!$('#modal .ov')&&!(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)))render();}
  }
  if(pay&&$('#dispchip')){var ch=displayChip();if(ch!==chipCache){chipCache=ch;$('#dispchip').innerHTML=ch;}}
  if(startedAsDisplay&&!dev()){var pp=SS.get('tw-pairing');if(pp&&pp.exp<now){newPairing();render();}}
},1000);
setInterval(function(){
  var a=document.activeElement,typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName),v=currentView();
  if(!$('#modal .ov')&&!typing&&(v==='orders'||v==='dashboard'||v==='online'))render();
},30000);

setInterval(function(){
  if(startedAsDisplay){if(displaySync())render();return;}
  var card=$('#dev-card'),a=document.activeElement;
  if(card&&currentView()==='admin'&&!(a&&card.contains(a))){var h=devicesCard();if(h!==devCache){devCache=h;card.innerHTML=h;}}
},3000);
if(startedAsDisplay)displaySync();else initOnline();
save();render();
})();
</script>
